<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Media Review App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .board { display: flex; gap: 20px; padding: 20px; }
        .column { flex: 1; background: #f8f9fa; border-radius: 8px; padding: 15px; min-height: 400px; }
        .card { margin-bottom: 10px; }
        #reviewFields { display: none; }
    </style>
</head>
<body>

<div class="container mt-4">
    <h1>🎬 Media Review Board</h1>

    <div class="card p-3 mb-4">
        <h5>新規登録 / レビュー投稿</h5>
        <form th:action="@{/save}" method="post" class="row g-2 align-items-end"> <div class="col-md-4">
            <label for="titleInput" class="form-label d-none">タイトル</label> <input type="text" id="titleInput" name="title" class="form-control" placeholder="タイトル" required>
        </div>

            <div class="col-md-3">
                <label for="typeSelect" class="form-label d-none">タイプ</label>
                <select id="typeSelect" name="type" class="form-select">
                    <option value="BOOK">本</option>
                    <option value="MOVIE">映画</option>
                </select>
            </div>

            <div class="col-md-3">
                <label for="statusSelect" class="form-label d-none">ステータス</label>
                <select name="status" id="statusSelect" class="form-select">
                    <option value="WANT">WANT (観たい)</option>
                    <option value="DONE">DONE (観た)</option>
                </select>
            </div>

            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">追加</button>
            </div>

            <div id="reviewFields" class="col-md-12 mt-2">
                <div class="row g-2">
                    <div class="col-md-2">
                        <select name="rating" class="form-select">
                            <option value="0">評価なし</option>
                            <option value="5">★★★★★</option>
                            <option value="4">★★★★</option>
                            <option value="3">★★★</option>
                            <option value="2">★★</option>
                            <option value="1">★</option>
                        </select>
                    </div>
                    <div class="col-md-10">
                        <textarea name="comment" class="form-control" placeholder="レビューを書く" rows="2"></textarea>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <div class="board">
        <div class="column">
            <h4 class="text-secondary">WANT (これから)</h4>
            <div th:each="item : ${wantList}" class="card shadow-sm mb-3">
                <div class="card-body">
                    <span class="badge bg-info text-dark" th:text="${item.type}">TYPE</span>
                    <h5 class="card-title mt-2" th:text="${item.title}">Title</h5>

                    <div class="mt-3 d-flex gap-2">
                        <button type="button" class="btn btn-sm btn-outline-success"
                                data-bs-toggle="modal"
                                th:data-bs-target="'#reviewModal' + ${item.id}">
                            観た！
                        </button>

                        <form th:action="@{/delete}" method="post">
                            <input type="hidden" name="id" th:value="${item.id}">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('削除してもよろしいですか？')">削除</button>
                        </form>
                    </div>
                </div>

                <div class="modal fade" th:id="'reviewModal' + ${item.id}" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <form th:action="@{/save}" method="post">
                                <div class="modal-header">
                                    <h5 class="modal-title">「<span th:text="${item.title}"></span>」のレビュー</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body text-start">
                                    <input type="hidden" name="id" th:value="${item.id}">
                                    <input type="hidden" name="title" th:value="${item.title}">
                                    <input type="hidden" name="type" th:value="${item.type}">
                                    <input type="hidden" name="status" value="DONE">

                                    <div class="mb-3">
                                        <label class="form-label">評価</label>
                                        <label>
                                            <select name="rating" class="form-select">
                                                <option value="5">★★★★★</option>
                                                <option value="4">★★★★</option>
                                                <option value="3" selected>★★★</option>
                                                <option value="2">★★</option>
                                                <option value="1">★</option>
                                            </select>
                                        </label>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">感想</label>
                                        <label>
                                            <textarea name="comment" class="form-control" rows="3" placeholder="おもしろかった！"></textarea>
                                        </label>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                                    <button type="submit" class="btn btn-success">保存してDONEへ移動</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="column">
            <h4 class="text-success">DONE (済み)</h4>
            <div th:each="item : ${doneList}" class="card shadow-sm mb-3">
                <div class="card-body">
                    <span class="badge bg-success" th:text="${item.type}">TYPE</span>
                    <h5 class="card-title mt-2" th:text="${item.title}">Title</h5>
                    <p class="text-warning mb-1">
                        <span th:if="${item.rating != null and item.rating > 0}"
                              th:text="${#strings.repeat('★', item.rating)}"></span>
                    </p>
                    <p class="card-text small text-muted" th:text="${item.comment}"></p>

                    <form th:action="@{/delete}" method="post" class="text-end">
                        <input type="hidden" name="id" th:value="${item.id}">
                        <button type="submit" class="btn btn-sm btn-link text-danger"
                                onclick="return confirm('削除してもよろしいですか？')">削除</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const statusSelect = document.getElementById('statusSelect');
    const reviewFields = document.getElementById('reviewFields');

    if(statusSelect) {
        statusSelect.addEventListener('change', function() {
            reviewFields.style.display = (this.value === 'DONE') ? 'block' : 'none';
        });
    }
</script>

</body>
</html>
