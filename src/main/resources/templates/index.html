<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>メディアレビューアプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .media-column {
            background: #f8f9fa; /* 薄いグレー */
            border-radius: 8px;   /* 角を丸く */
            padding: 15px;        /* 中の余白 */
            min-height: 400px;    /* 最低限の高さ */
        }
        .card { margin-bottom: 10px; }
        #reviewFields { display: none; }

        .media-card-body {
            display: flex; /* 横並びにする */
            gap: 15px;     /* 画像とテキストの間の余白 */
        }

        .poster-container {
            flex-shrink: 0; /* 画像が潰れないように固定 */
        }

        .media-poster {
            width: 80px;      /* 幅を統一 */
            height: 110px;    /* 高さを統一 */
            object-fit: cover; /* 縦横比を維持して枠いっぱいに表示 */
            border-radius: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            background-color: #e9ecef; /* 画像がない時の背景色 */
        }

        .content-container {
            flex-grow: 1; /* 残りのスペースをすべて使う */
        }
    </style>
</head>
<body>

<div class="container mt-4">
    <h1>メディアレビューアプリ</h1>

    <!--/*@thymesVar id="successMessage" type="java.lang.String"*/-->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}">成功しました！</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}">エラーが発生しました。</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card p-3 mb-4">
        <h5>気になるリスト登録 / レビュー登録</h5>
        <form th:action="@{/save}" method="post" class="row g-2 align-items-end"
              onsubmit="this.querySelector('button[type=submit]').disabled=true;">
            <div class="col-md-4">
                <label for="titleInput" class="form-label d-none">タイトル</label>
                <input type="text" id="titleInput" name="title" class="form-control" placeholder="タイトル" required>
            </div>

            <div class="col-md-3">
                <label for="typeSelect" class="form-label d-none">タイプ</label>
                <select id="typeSelect" name="type" class="form-select">
                    <option value="MOVIE">映画</option>
                    <option value="DRAMA">ドラマ</option>
                    <option value="BOOK">本</option>
                    <option value="GAME">ゲーム</option>
                    <option value="MUSIC">音楽</option>
                </select>
            </div>

            <div class="col-md-3">
                <label for="statusSelect" class="form-label d-none">ステータス</label>
                <select name="status" id="statusSelect" class="form-select">
                    <option value="WANT">気になるリスト</option>
                    <option value="DONE">レビュー</option>
                </select>
            </div>

            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">追加</button>
            </div>

            <div id="reviewFields" class="col-md-12 mt-2">
                <div class="row g-2">
                    <div class="col-md-2">
                        <label for="ratingInput" class="form-label d-none">評価</label>
                        <select id="ratingInput" name="rating" class="form-select">
                            <option value="0">評価なし</option>
                            <option value="5">★★★★★</option>
                            <option value="4">★★★★</option>
                            <option value="3" selected>★★★</option>
                            <option value="2">★★</option>
                            <option value="1">★</option>
                        </select>
                    </div>
                    <div class="col-md-10">
                        <label for="commentInput" class="form-label d-none">レビュー</label>
                        <textarea id="commentInput" name="comment" class="form-control" placeholder="レビューを書く" rows="2"></textarea>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <div class="row">
        <div class="col-12 col-md-6 mb-4">
            <div class="media-column">
                <h4 class="text-secondary">気になるリスト</h4>
                <div th:each="item : ${wantList}" class="card shadow-sm mb-3">
                    <div class="card-body media-card-body"> <div class="poster-container">
                        <img th:if="${item.imageUrl != null}" th:src="${item.imageUrl}" class="media-poster" th:alt="${item.title}">
                        <div th:unless="${item.imageUrl != null}" class="media-poster d-flex align-items-center justify-content-center">
                            <span class="text-muted" style="font-size: 10px;">No Image</span>
                        </div>
                    </div>

                        <div class="content-container">
                        <span class="badge bg-secondary text-white">
                            <span th:if="${item.type == 'MOVIE'}">🎬</span>
                            <span th:if="${item.type == 'DRAMA'}">🎭</span>
                            <span th:if="${item.type == 'BOOK'}">📖</span>
                            <span th:if="${item.type == 'GAME'}">🎮</span>
                            <span th:if="${item.type == 'MUSIC'}">🎵</span>
                            <span th:text="${item.type}">TYPE</span>
                        </span>
                            <h5 class="card-title mt-1 mb-1" th:text="${item.title}" style="font-size: 1.1rem;">タイトル</h5>
                            <div class="mt-2 d-flex gap-2">
                                <button type="button" class="btn btn-sm btn-success" data-bs-toggle="modal" th:data-bs-target="'#reviewModal' + ${item.id}">完了！</button>
                                <form th:action="@{/delete}" method="post">
                                    <input type="hidden" name="id" th:value="${item.id}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('本当に削除しますか？')">削除</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="modal fade" th:id="'reviewModal' + ${item.id}" tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <form th:action="@{/save}" method="post"
                                      onsubmit="this.querySelector('button[type=submit]').disabled=true;">
                                    <div class="modal-header">
                                        <h5 class="modal-title">"<span th:text="${item.title}"></span>"の評価</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                    </div>
                                    <div class="modal-body text-start">
                                        <input type="hidden" name="id" th:value="${item.id}">
                                        <input type="hidden" name="title" th:value="${item.title}">
                                        <input type="hidden" name="type" th:value="${item.type}">
                                        <input type="hidden" name="status" value="DONE">

                                        <div class="mb-3">
                                            <label class="form-label">評価</label>
                                            <label>
                                                <select name="rating" class="form-select">
                                                    <option value="5">★★★★★</option>
                                                    <option value="4">★★★★</option>
                                                    <option value="3" selected>★★★</option>
                                                    <option value="2">★★</option>
                                                    <option value="1">★</option>
                                                </select>
                                            </label>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">レビュー</label>
                                            <label>
                                                <textarea name="comment" class="form-control" rows="3" placeholder="最高！"></textarea>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                                        <button type="submit" class="btn btn-success">保存する</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6">
            <div class="media-column">
                <h4 class="text-success">レビュー</h4>
                <div th:each="item : ${doneList}" class="card shadow-sm mb-3">
                    <div class="card-body media-card-body"> <div class="poster-container">
                        <img th:if="${item.imageUrl != null}" th:src="${item.imageUrl}" class="media-poster" th:alt="${item.title}">
                        <div th:unless="${item.imageUrl != null}" class="media-poster d-flex align-items-center justify-content-center">
                            <span class="text-muted" style="font-size: 10px;">No Image</span>
                        </div>
                    </div>

                        <div class="content-container">
                        <span class="badge bg-secondary text-white">
                            <span th:if="${item.type == 'MOVIE'}">🎬</span>
                            <span th:text="${item.type}">TYPE</span>
                        </span>
                            <h5 class="card-title mt-1 mb-0" th:text="${item.title}">タイトル</h5>
                            <p class="text-warning mb-1">
                                <span th:if="${item.rating != null and item.rating > 0}" th:text="${#strings.repeat('★', item.rating)}"></span>
                            </p>
                            <p class="card-text small text-muted mb-2" th:text="${item.comment}"></p>
                            <form th:action="@{/delete}" method="post" class="text-end">
                                <input type="hidden" name="id" th:value="${item.id}">
                                <button type="submit" class="btn btn-sm btn-link text-danger p-0" onclick="return confirm('Are you sure?')">削除</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const statusSelect = document.getElementById('statusSelect');
    const reviewFields = document.getElementById('reviewFields');

    if(statusSelect) {
        statusSelect.addEventListener('change', function() {
            reviewFields.style.display = (this.value === 'DONE') ? 'block' : 'none';
        });
    }
</script>

</body>
</html>
