<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>メディアレビューアプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 分離しているウェルカムポップアップのstyleを呼び出す -->
    <th:block th:replace="~{fragments/welcome-modal :: welcomeStyle}"></th:block>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container mt-4">

        <!-- 分離しているウェルカムポップアップの要素を呼び出す -->
        <div th:replace="~{fragments/welcome-modal :: welcomePopup}"></div>

        <h1>メディアレビューアプリ</h1>

        <!-- 分離している通知エリアを呼び出す -->
        <div th:replace="~{fragments/alert :: commonAlert}"></div>

        <div th:replace="~{fragments/form-card :: registerForm}"></div>

        <div th:replace="~{fragments/media-list-section :: mediaList}"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
