<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <title>
    </title>
</head>
<body>
    <div th:fragment="welcomePopup" id="welcomeModalOverlay" class="welcome-overlay" style="display: none;">

        <style>
            /* ポップアップの背景（画面全体を覆う暗幕） */
            .welcome-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(7, 11, 22, 0.5) !important; /* 深い宇宙のような透明な黒 */
                /* 背景のアプリ画面を綺麗にぼかすための魔法の記述 */
                backdrop-filter: blur(8px) !important;
                -webkit-backdrop-filter: blur(8px) !important;
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* ポップアップのカード本体（すりガラス＋ネオン装飾） */
            .welcome-modal {
                background: rgba(20, 30, 48, 0.75) !important; /* 半透明のダークブルー */
                backdrop-filter: blur(20px) !important; /* 擦りガラス効果をさらに強固に */
                -webkit-backdrop-filter: blur(20px) !important;
                border: 1px solid rgba(255, 255, 255, 0.08) !important; /* 薄いガラスの輪郭 */
                padding: 30px;
                border-radius: 16px !important; /* 角丸を滑らかに */
                max-width: 600px;
                width: 90%;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5) !important;
                position: relative;
                color: #e2e8f0 !important; /* 文字を読みやすい白系に */
                animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); /* 近未来的なシュッとした出現アニメーション */
            }

            /* アプリタイトル（ネオン発光） */
            .welcome-modal h3.text-primary {
                color: #0dcaf0 !important; /* 鮮やかなネオンブルーに変更 */
                font-weight: 800;
                text-shadow: 0 0 10px rgba(13, 202, 240, 0.6);
                letter-spacing: 1px;
            }

            /* 箇条書きの強調整形 */
            .welcome-modal strong {
                color: #0dcaf0 !important; /* 各機能の頭文字をネオンブルーにして視認性アップ */
            }

            /* 区切り線（うっすらとしたサイバーライン） */
            .welcome-modal hr {
                border-top: 1px solid rgba(255, 255, 255, 0.1) !important;
                opacity: 1;
            }

            /* 閉じるボタン（×）の白化 */
            .welcome-close {
                position: absolute;
                top: 20px;
                right: 20px;
                filter: invert(1) grayscale(1) brightness(2); /* 黒いアイコンを白に反転 */
                opacity: 0.7;
            }
            .welcome-close:hover {
                opacity: 1;
            }

            /* 始めるボタン（グラデーションカプセル型） */
            .welcome-modal .btn-primary {
                background: linear-gradient(135deg, #00c6ff, #0072ff) !important;
                color: white !important;
                border: none !important;
                border-radius: 50px !important;
                padding: 10px 35px !important;
                font-weight: bold;
                box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4) !important;
                transition: all 0.3s ease !important;
            }
            .welcome-modal .btn-primary:hover {
                transform: translateY(-2px) scale(1.05) !important;
                box-shadow: 0 6px 20px rgba(0, 198, 255, 0.6) !important;
            }

            /* 出現アニメーション */
            @keyframes fadeIn {
                from { opacity: 0; transform: scale(0.95) translateY(10px); }
                to { opacity: 1; transform: scale(1) translateY(0); }
            }
        </style>

        <div class="welcome-modal">
            <button type="button" class="btn-close welcome-close" id="closeWelcomeBtn" aria-label="Close"></button>
            <div class="text-center">
                <h3 class="text-primary mb-3">メディアレビューアプリ</h3>
                <p>このアプリでは、あなたの気になる作品やコンテンツの感想を管理できます。</p>
            </div>
            <hr>
            <div class="mt-3">
                <h5>基本的な使い方</h5>
                <ul class="text-start">
                    <li><strong>気になるリスト：</strong> ステータス欄で「気になるリスト」を選択するとこれから見たい・読みたい作品を登録できます。</li>
                    <li><strong>レビュー：</strong> ステータス欄で「レビュー」を選択するとタイトルに加えて作品の評価（星）と感想も記録できます。</li>
                    <li><strong>サジェスト機能：</strong> タイトルを入力すると、自動で候補が表示されます。（タイムラグがあります。）</li>
                </ul>
            </div>
            <div class="text-center mt-4">
                <button type="button" class="btn btn-primary" id="startAppBtn">始める</button>
            </div>
        </div>

        <script>
            const welcomeOverlay = document.getElementById('welcomeModalOverlay');
            const closeWelcomeBtn = document.getElementById('closeWelcomeBtn');
            const startAppBtn = document.getElementById('startAppBtn');
            const hasVisited = localStorage.getItem('hasVisitedMediaApp');

            if (!hasVisited) {
                // フラグがなければ（初めての訪問なら）ポップアップを表示
                welcomeOverlay.style.display = 'flex';
            }

            // ポップアップを閉じる共通の関数
            function closeWelcomeModal() {
                welcomeOverlay.style.display = 'none';
                localStorage.setItem('hasVisitedMediaApp', 'true');
            }

            // イベントリスナーの登録
            closeWelcomeBtn.addEventListener('click', closeWelcomeModal);
            startAppBtn.addEventListener('click', closeWelcomeModal);
        </script>

    </div>
</body>
</html>
